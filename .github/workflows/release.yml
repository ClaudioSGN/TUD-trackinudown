name: Publicar atualização do TUD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar tipos
        run: npm run typecheck
      - name: Executar testes
        run: npm test
      - name: Compilar instalador
        run: npm run build && npx electron-builder --win nsis --x64 --publish never
      - name: Publicar release e arquivos da atualização
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/TUD Setup $version.exe"
          $remoteInstaller = "release/TUD-Setup-$version.exe"
          $remoteBlockmap = "$remoteInstaller.blockmap"
          Copy-Item -LiteralPath $installer -Destination $remoteInstaller -Force
          Copy-Item -LiteralPath "$installer.blockmap" -Destination $remoteBlockmap -Force
          gh release create $env:GITHUB_REF_NAME $remoteInstaller $remoteBlockmap "release/latest.yml" --title "TUD $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
